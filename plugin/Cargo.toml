[package]
name = "services"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "services_core"
path = "src/lib.rs"

[[bin]]
name = "services"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
futures-util = "0.3"
polkit = { path = "polkit" }
yoke-sdk = "=0.6.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

# A Plugin is a program of its own, never a member of a workspace around it.
[workspace]
